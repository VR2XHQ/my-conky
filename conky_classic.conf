conky.config = {
    -- 基本設定
    background = false,
    update_interval = 1,
    double_buffer = true,
    no_buffers = true,
    use_xft = true,

    -- GNOME 專用視窗設定（穩定透明）
    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 100,
    own_window_colour = '#0b0d18',

    -- 邊框與間距
    border_inner_margin = 5,
    border_width = 1,
    stippled_borders = 10,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    -- 字體與顏色
    font = 'DejaVu Sans Mono:size=12',
    font1 = 'DejaVu Sans Mono:size=10',
    font2 = 'DejaVu Sans Mono:size=14',
    font3 = 'DejaVu Sans Mono:size=20',
    font8 = 'Noto Sans Mono CJK HK:size=16',
    font9 = 'Noto Sans Mono CJK HK:size=12',
    default_color = 'lightyellow',
    color0 = 'orange',
    color1 = 'skyblue',
    color2 = 'lightgreen',

    -- 位置與大小
    alignment = 'top_right',
    gap_x = 20,
    gap_y = 20,
    minimum_width = 350,
    maximum_width = 600,
    -- minimum_height = 960,
};

conky.text = [[
${alignc}${font3}${color}${time %Y-%m-%d %H:%M:%S}
${goto 40}${font2}${color0}Key_Caps: ${key_caps_lock}${goto 210}Key_Num: ${key_num_lock}
${font}${color}${stippled_hr}
${font2}${color}System${font}${goto 120}${execi 600 lsb_release -ds | tr '[:upper:]' '[:lower:]'}
Hostname:${goto 120}$nodename
Kernel:${goto 120}$kernel
Uptime:${goto 120}$uptime
Load Avg:${goto 120}$loadavg
Processes: $processes${goto 200}Running: $running_processes
${font}${color}${stippled_hr}
${font2}${color2}CPU${font} ${cpubar 15,250}${font2}
${goto 60}${cpu cpu0}%  ${cpu cpu1}%  ${cpu cpu2}%  ${cpu cpu3}%
${goto 60}${cpu cpu4}%  ${cpu cpu5}%  ${cpu cpu6}%  ${cpu cpu7}%
ACPI Temp: +${acpitemp}°C
Package Temp: ${execi 5 sensors | grep 'Package id 0' | awk '{print $4}'} 
${font}${color}${stippled_hr}
${font2}${color}Audio (PulseAudio)${font1} ${if_match ${pa_sink_volume} <= 33}${color green}${else}${if_match ${pa_sink_volume} <= 66}${color yellow}${else}${color red}${endif}${endif}${pa_sink_volumebar 15,100} ${pa_sink_volume}%${color}
Sink: ${font :size=10}${pa_sink_description}
# ${execi 5 pactl list sinks | awk -v SINK="$(pactl get-default-sink)" '
#     $0 ~ "Name: " SINK {found=1}
#     found && /Description:/ {
#         sub(/^.*Description: /, "Sink: ", $0)
#         print $0
#         exit
#     }
# '}
${font1}Port: ${pa_sink_active_port_description}
# Output: ${execi 5 ~/.config/conky/scripts/output_type.sh}
# ${execi 2 pactl get-sink-volume @DEFAULT_SINK@ | head -n 1 | awk '{print $5}'}
# ${color}Volume: ${execibar 2 20,200 pactl get-sink-volume @DEFAULT_SINK@ | head -n 1 | awk '{print $5}' | tr -d '%'} ${execi 2 pactl get-sink-volume @DEFAULT_SINK@ | head -n 1 | awk '{print $5}'}
# ${if_match ${pa_sink_volume} <= 33}${color green}${else}${if_match ${pa_sink_volume} <= 66}${color yellow}${else}${color red}${endif}${endif}Volume: ${pa_sink_volumebar 20,200} ${execi 2 pactl get-sink-volume @DEFAULT_SINK@ | head -n 1 | awk '{print $5}'}${color}
# ${font}${color0}Output:${goto 90}${if_pa_sink_muted}muted${else}unmuted${endif}${goto 200}Input:${goto 270}${if_pa_source_muted}muted${else}unmuted${endif}
${font}${goto 20}${if_match "${execi 2 pactl get-sink-mute @DEFAULT_SINK@ | grep -c 'yes'}" == "1"}\
${color #808080}Sound_Out${color}${else}${color #FFA500}Sound_Out${color}${endif}\
${goto 150}${if_match "${execi 2 pactl get-source-mute @DEFAULT_SOURCE@ | grep -c 'yes'}" == "1"}\
${color #808080}Sound_In${color}${else}${color #FFA500}Sound_In${color}${endif}
${font}${color}${stippled_hr}
${font2}${color1}Network and Usage${font}
Ethernet enp2s0:${goto 200}${downspeedgraph enp2s0 15,100 00FF00 006600}
${addr enp2s0}${goto 130}D: ${downspeed enp2s0}${goto 240}U: ${upspeed enp2s0}
Wi‑Fi wlp0s20f3:${goto 200}${downspeedgraph wlp0s20f3 15,100 00FF00 006600}
${addr wlp0s20f3}${goto 130}D: ${downspeed wlp0s20f3}${goto 240}U: ${upspeed wlp0s20f3}
${font}${color}${stippled_hr}${color2}
Today RX:      ${execi 60 vnstat -d | grep "$(date +%Y-%m-%d)" | awk '{print $2 " " $3}'}
Today TX:      ${execi 60 vnstat -d | grep "$(date +%Y-%m-%d)" | awk '{print $5 " " $6}'}
Today Total:   ${execi 60 vnstat -d | grep "$(date +%Y-%m-%d)" | awk '{print $8 " " $9}'}
Month RX:      ${execi 300 vnstat -m | grep "$(date +%Y-%m)" | awk '{print $2 " " $3}'}
Month TX:      ${execi 300 vnstat -m | grep "$(date +%Y-%m)" | awk '{print $5 " " $6}'}
Month Total:   ${execi 300 vnstat -m | grep "$(date +%Y-%m)" | awk '{print $8 " " $9}'}
${font}${color}${stippled_hr}
${font2}${color}Disk${font}
Root: ${fs_used /} / ${fs_size /}  ${fs_bar 10,60 /} ${fs_used_perc /}%
Home: ${fs_used /home} / ${fs_size /home}  ${fs_bar 10,60 /home} ${fs_used_perc /home}%
${font}${color}${stippled_hr}
${font8}${color2}Weather (香港天文台)${font9}
${execi 600 ~/.config/conky/scripts/hko_weather.sh | sed -e 's/^/ /'}${font}
${font}${color}${stippled_hr}
${font2}${color ccffff}${scroll 20 Conky Version : ${conky_version}}
]];
